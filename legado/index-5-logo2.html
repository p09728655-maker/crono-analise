    <script>
      (function(){

          var mlink = document.createElement('link');
          mlink.rel = 'manifest'; mlink.href = URL.createObjectURL(blob);
          document.head.appendChild(mlink);
        };
        img.src = dataUrl;
      })();

"Desvio padrão da amostra. Mede a dispersão dos tempos coletados."],["DP","Desvio Padrão — mesmo que σ. Aparece em alguns relatórios como 'DP'."],["R1 / R2","Rodada 1 e Rodada 2 — blocos de observações separados pelo analista durante a coleta. Útil para comparar dois turnos, antes/depois de melhoria, etc."],["MO","Mão de Obra — número de operadores. A carga de MO por operação = TP × Nº de operadores."],["op","Operador(es) — abreviação de operador. Ex: '2 op' significa 2 operadores trabalhando nessa operação."],["Nº obs","Número de observações (cronometragens) coletadas para aquela operação."],["⏸","Ícone de parada — indica que foram registradas paradas de linha durante a coleta daquela operação."],["✓","Operação com meta de observações atingida. Meta é definida no campo 'Meta de observações' na CONFIG."],["SMED","Single Minute Exchange of Die — técnica de redução do tempo de setup (< 10 min). Sugerida quando o motivo de parada for Setup."],["TPM","Total Productive Maintenance — manutenção produtiva total. Sugerida quando houver muitas paradas por falha de equipamento."],["CEP","Controle Estatístico de Processo — uso de cartas de controle para monitorar variabilidade. CV% > 20% sugere aplicar CEP."],["MOP","Manual de Operação Padrão — documento que descreve o método correto de execução da operação."],["KPI","Key Performance Indicator — indicador-chave de desempenho. Ex: OEE, CAP/H, TP."]],d=a?c.filter(([u,h])=>l(u)||l(h)):c;return d.length?f.jsxs("div",{style:{background:"rgba(245,158,11,0.07)",border:"1px solid rgba(245,158,11,0.3)",borderRadius:10,padding:"18px 22px",marginBottom:20},children:[f.jsx("div",{style:{fontSize:13,fontWeight:900,color:e.ylw,marginBottom:14,letterSpacing:.5},children:"📖 GLOSSÁRIO — TODAS AS ABREVIAÇÕES"}),f.jsx("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:6},children:d.map(([u,h])=>f.jsxs("div",{style:{display:"flex",gap:10,alignItems:"flex-start",padding:"4px 0"},children:[f.jsx("span",{style: ERAÇÕES — Nº operadores","Cada operação tem um campo numérico '− N +' indicando quantos operadores trabalham nela. Padrão = 1. Altere quando uma operação exigir 2 ou mais pessoas. Afeta o cálculo de Carga MO no Yamazumi."],["OPERAÇÕES — botão ⇒ DIV","Aparece quando Nº operadores > 1. Clique para dividir a operação em sub-operações (ex: OP6 com 2 op → OP6A + OP6B), cada uma com 1 operador e tempos zerados, prontas para coleta individual."],["⧉ DUPLICAR ESTUDO","Cria cópia do estudo atual com nome automático (ex: Estudo → Estudo v2 → v3). Todos os dados e tempos são copiados. Use para comparar antes/depois de melhorias na aba ⑧."],["INTEGRAÇÃO CLAUDE (IA)","Informe sua API Key Anthropic para obter análise inteligente do estudo: gargalos, desequilíbrios e recomendações. A chave é salva localmente no navegador e nunca enviada a terceiros."]]},{num:"②",titulo:"CAPTURA — Cronometrar os Tempos",cor:"#7c3aed",itens:[["▶ INICIAR / ▶ CONTINUAR","Inicia a cronometragem da operação selecionada. Se já houver dados, continua adicionando observações. O tempo começa a contar assim que você clica."],["Botão REG (grande vermelho)","Registra o tempo do ciclo atual como nova observação. Cada clique = 1 ciclo cronometrado. Atalho de teclado: ESPAÇO."],["Modo Cooperativo (👷A / 👷B…)","Quando a operação tem Nº operadores > 1, o botão REG é substituído por N botões — um por operador. Cada botão registra independentemente, exibindo o contador de observações de cada operador. Os tempos são acumulados e analisados juntos."],["⏸ PAUSAR (P)","Pausa a cronometragem e abre o formulário de parada. Selecione o motivo e adicione observação opcional. Atalho: P (durante captura). Para retomar: ▶ RETOMAR PRODUÇÃO ou P novamente."],["Motivos de parada","Puxar Pilha · Abastecer Isomantas · Troca de Plástico · Falta de Material · Setup · Falta de Peças · Outro. Cada parada é registrada com motivo, duração e horário de início."],["■ FIM","Encerra a captura e volta à lista de operações. Atalho: ESC. O botão é grande para facilitar o uso no celular ou tablet no chão de fábrica."],["Modo Sequencial","Percorre todas as operações em ordem automaticamente. Ao finalizar uma, exibe a próxima para iniciar. Ideal para linha de produção contínua. Ative com ▶▶ MODO SEQUENCIAL."],["⚑ R2 — Marcar Rodada 2","Botão verde ao lado de operações com dados. Clique para marcar o início da Rodada 2 a partir da próxima observação. Os tempos exibem badge R1 (verde) e R2 (amarelo). Útil para separar turnos, antes/depois de melhoria ou lotes diferentes."],["⚑ R2 ✕ — Remover Rodada","Remove a marcação de Rodada 2, unificando todos os tempos novamente em um único bloco."],["↺ Apagar captura","Botão ao lado de cada operação com dados. Apaga todos os tempos, paradas e marcação de rodada (pede confirmação)."],["Tempos coletados","Lista com número (#) e valor de cada tempo registrado. Badge R1/R2 quando há rodada marcada. Clique ✕ para excluir uma observação individual. Tempos < 200ms são ignorados automaticamente no cálculo."],["Barra de progresso","Indica o percentual da meta de observações atingido. Verde = meta OK · Vermelho = ainda incompleto. A mensagem ✓ META ATINGIDA aparece quando a meta é alcançada."],["Atalhos de teclado","ESPAÇO = registrar tempo · P = pausar/retomar · ESC = encerrar captura. Funcionam apenas quando não há campo de texto selecionado."]]},{num:"③",titulo:"RELATÓRIO — Analisar os Resultados",cor:"#0369a1",itens:[["TO (Tempo Observado)","Média aritmética dos tempos cronometrados válidos (> 200ms). Tempos muito curtos (< 200ms) são descartados como erro de toque acidental."],["TN (Tempo Normal)","TO × FR/100. Normaliza para operador em ritmo padrão (100%). Ex: TO = 10s, FR = 110% → TN = 11s. Operadores mais rápidos têm FR > 100%."],["TP (Tempo Padrão)","TN × (1 + Tolerância/100). Tempo oficial para planejamento. Ex: TN = 11s, Tolerância = 15% → TP = 12,65s. Usado em todos os cálculos de capacidade."],["CV% (Coef. de Variação)","Desvio Padrão ÷ Média × 100. ≤ 10% = bom (processo estável) · 10–20% = atenção · > 20% = instável (investigar com carta de controle na aba ⑤ PADRÕES)."],["CAP/H (Capacidade/hora)","3.600 ÷ TP (em segundos). Peças por hora que a operação consegue produzir. Limitada pelo gargalo (operação com menor CAP/H)."],["Nº obs válidas","Quantidade de observações usadas no cálculo (tempos > 200ms). Exclui erros de toque."],["OEE","Eficiência Global = Disponibilidade × Desempenho × Qualidade. Requer Tempo Disponível, Peças Produzidas e Rejeitadas na aba CONFIG. OEE > 85% é considerado excelente."],["Exportar PDF (⎙)","Relatório completo A4 landscape com cabeçalho, tabela de resultados por operação, OEE e data. Abre em nova aba para imprimir ou salvar."],["Exportar Excel (↓)","Planilha com 4 abas: Consolidado (resumo), Tempos Coletados, Paradas Registradas e Sugestões de Melhoria."],["📋 FOLHA DE COLETA","Abre folha em branco A4 landscape para coleta manual no chão de fábrica, com cabeçalho do estudo e tabela de operações sem dados."]]},{num:"④",titulo:"SUGESTÕES — Melhorias Automáticas",cor:e.ylw,itens:[["🔴 Alta prioridade","CV% > 20% ou ≥ 3 paradas registradas. Ação imediata. Ferramentas sugeridas: Ishikawa (causa raiz), SMED (setup), TPM (manutenção), MOP (padronização)."],["🟡 Média prioridade","CV% entre 10–20%, 1–2 paradas, TP elevado em relação ao Takt ou total parado > 10 min. Oportunidade de melhoria identificada."],["🟢 Baixa prioridade","Menos de 10 observações coletadas. Coletar mais dados para garantir validade estatística (veja fórmula de Nievel na CONFIG)."],["Análise com IA (Claude)","Se a API Key Anthropic estiver configurada na aba CONFIG, o botão ANALISAR COM CLAUDE gera um diagnóstico inteligente do estudo completo com recomendações específicas por operação."]]},{num:"⑤",titulo:"PADRÕES — Análise Estatística Avançada",cor:e.grn,itens:[["Carta de Controle (±3σ)","Gráfico com todas as observações em sequência. UCL = Média + 3σ (linha vermelha) · LCL = Média − 3σ (linha azul). Pontos acima do UCL ou abaixo do LCL = outliers (cor vermelha). Use para identificar causas especiais de variação."],["Sobreposição R1/R2","Com Rodada 2 marcada, o gráfico sobrepõe as duas rodadas: R1 em verde, R2 em amarelo, cada uma com sua linha de média tracejada. Permite comparação visual direta."],["Comparativo de Rodadas","Tabela com TO Médio, TP e CV% de cada rodada lado a lado, variação Δ% (▼ GANHO em verde / ▲ PERDA em vermelho) e impacto na capacidade (pçs/h)."],["Tendência","Regressão linear sobre as observações. ↑ CRESCENTE = possível fadiga do operador · ↓ DECRESCENTE = aprendizado ou aquecimento · → ESTÁVEL = processo controlado. R² > 0,5 = tendência estatisticamente significativa."],["Δ 1ª → 2ª Metade","Compara a média da 1ª metade das observações com a 2ª metade. Valor positivo = fadiga (tempos aumentando). Valor negativo = aprendizado ou aquecimento."],["Exportar PDF / Excel","PDF A4 landscape com tabela estatística completa. Excel com abas Padrões e Tempos Coletados por operação."]]},{num:"⑥",titulo:"YAMAZUMI — Balanceamento de Linha",cor:"#0891b2",itens:[["Gráfico de barras (Yamazumi)","Barras horizontais com o TP de cada operação. Linha vertical amarela = Takt Time. Cores: 🟢 Verde = < 80% do Takt (OK) · 🟡 Amarelo = 80–100% (atenção) · 🔴 Vermelho = > 100% do Takt (gargalo)."],["Toggle ⏱ Tempo de Ciclo / 👷 Carga MO","Botão no topo do gráfico. Modo TEMPO DE CICLO: exibe o TP de cada operação (padrão). Modo CARGA MO: exibe TP × Nº de operadores — mostra a carga real de mão de obra por operação. Útil para dimensionamento de pessoal."],["Capacidade esperada vs real","ESPERADO = 3.600 ÷ Takt (peças/h que o mercado demanda). REAL = 3.600 ÷ TP do gargalo (peças/h que a linha consegue produzir). Atingimento % e déficit/superávit em pçs/h."],["Balanceamento automático","Agrupa operações em estações respeitando o Takt Time pelo algoritmo First Fit Decreasing. Cada estação exibe ocupação % e lista as operações alocadas."],["Eficiência do balanceamento","Σ TP de todas as ops ÷ (Nº estações × Takt) × 100. Meta: > 85%. Valor baixo indica oportunidade de redistribuir operações entre estações."],["Exportar PDF / Excel","PDF A4 landscape com gráfico, tabela de TPs e balanceamento por estação. Excel com abas Yamazumi e Balanceamento."]]},{num:"⑦",titulo:"OPERADORES — Dimensionamento",cor:"#7c3aed",itens:[["Fórmula de dimensionamento","Nº de operadores = Σ TP de todas as operações ÷ Takt Time. Requer Takt Time definido na aba CONFIG."],["Resultado arredondado","O resultado exato (ex: 3,2) é arredondado para cima (ex: 4). Não é possível ter fração de operador."],["Eficiência com esse número","(Resultado exato ÷ Resultado arredondado) × 100. Ex: precisa 3,2 → arredonda para 4 → eficiência = 80%. Indica ociosidade gerada pelo arredondamento."],["Comparador de quadro atual","Informe quantos operadores você tem hoje. O sistema calcula excesso ou falta de operadores e a eficiência real com esse quadro."],["Tabela por operação","Lista cada operação com TP, % do Takt e contribuição para o total de operadores necessários."],["Exportar PDF","Relatório A4 portrait com fórmula, resultado, tabela por operação e análise comparativa do quadro atual vs necessário."]]},{num:"⑧",titulo:"ANTES/DEPOIS — Comparativo de Melhoria",cor:"#0369a1",itens:[["Fluxo recomendado","1. Colete tempos no estudo original. 2. Na aba CONFIG, clique ⧉ DUPLICAR ESTUDO — gera cópia com sufixo v2. 3. Abra o estudo v2, implemente a melhoria e colete novos tempos. 4. Na aba ⑧, selecione o estudo original como ANTES e o v2 como DEPOIS."],["Seleção ANTES / DEPOIS","Clique no botão ANTES (vermelho) do estudo de referência e DEPOIS (verde) do estudo melhorado. O painel superior confirma os estudos selecionados."],["KPIs de melhoria","Exibe automaticamente: redução de TP (%), ganho de capacidade (pçs/h) e variação no número de operadores necessários."],["Tabela comparativa","Linha a linha: TP Antes · TP Depois · Δ% · CAP/H Antes · CAP/H Depois · Status (↑ melhora / ↓ piora). Δ% negativo = melhoria (tempo reduziu). Positivo = piora."],["Exportar PDF","Relatório A4 portrait com cabeçalho, tabela comparativa, KPIs e rodapé. Botão ⎙ EXPORTAR PDF."]]},{num:"⚙",titulo:"SISTEMA — Empresa, Usuários e Acesso",cor:"#475569",itens:[["Botão ⚙ Sistema (cabeçalho)","Abre as configurações globais do app. Contém três abas: Empresa, Usuários e Motivos de Parada."],["🏢 Empresa","Cadastre os dados da empresa (nome, CNPJ, setor, etc.). Essas informações aparecem nos relatórios exportados como PDF."],["👥 Usuários — cadastro","Cadastre usuários com nome, e-mail, senha e papel (Admin · Analista · Visualizador). Os dados ficam salvos localmente no navegador."],["🔐 Autenticação — como funciona","Se houver ao menos 1 usuário cadastrado, o app exibe uma tela de login ao ser aberto. Informe e-mail e senha para entrar. Se não houver nenhum usuário, o app abre direto (modo livre)."],["Sair (logout)","Botão 'Sair' aparece no cabeçalho ao lado do nome do usuário logado. Clique para voltar à tela de login."],["Papéis de usuário","Admin = acesso total · Analista = uso normal · Visualizador = consulta. Os papéis são informativos por enquanto — controle de permissões por papel será implementado futuramente."],["Segurança","As senhas são armazenadas em texto no localStorage do navegador local. Este app não possui servidor — adequado para uso interno em pendrive. Não use senhas críticas."],["Motivos de parada","Gerencie a lista de motivos disponíveis na captura (ex: Falta de Material, Setup, TPM). Adicione, edite ou remova motivos conforme a realidade da sua linha."]]},{num:"⊕",titulo:"DADOS, BACKUP E DICAS GERAIS",cor:e.muted,itens:[["Onde ficam os dados","Os dados são salvos automaticamente no localStorage do navegador desta máquina. Se você limpar o navegador ou trocar de computador, os dados são perdidos — salve o JSON."],["⚠ SALVAR (botão no topo)","Aparece vermelho piscando quando há dados não salvos. Clique para baixar o arquivo ritmoprod-dados.json. Importe esse arquivo na próxima vez que abrir em outro computador."],["Pendrive / Auto-save","Na tela inicial, clique 🖫 VINCULAR ARQUIVO e selecione um arquivo .json no pendrive. O app salva automaticamente nesse arquivo a cada alteração. Na próxima vez, clique ↑ ABRIR DO PENDRIVE para carregar."],["Backup JSON (tela inicial)","↓ EXPORTAR JSON: salva todos os estudos em um arquivo. ↑ IMPORTAR JSON: restaura estudos de um arquivo salvo anteriormente. Faça backup sempre antes de trocar de computador."],["Exportar estudo individual","Na lista de estudos (tela inicial), clique ↓ ao lado do estudo para exportar apenas aquele estudo em JSON."],["Comparar 2 estudos","Tela inicial → botão ⇄ COMPARAR: selecione 2 estudos para ver tabela comparativa lado a lado (TP, CAP/H, Δ%)."],["Modo escuro/claro","Botão 🌙/☀ no cabeçalho. Preferência de visual, não afeta os dados."],["FR% — como avaliar","85% = muito lento · 90% = abaixo do padrão · 95% = levemente abaixo · 100% = ritmo normal · 105% = acima · 110% = muito rápido. Um FR% mal calibrado distorce todo o estudo — treine o olho clínico com filmes padrão."],["Observações inválidas","Tempos < 200ms são descartados automaticamente (erros de toque duplo). Você pode excluir manualmente qualquer observação clicando ✕ ao lado dela na lista da CAPTURA."],["Formulário de Nievel","Para definir quantas obs coletar: n = (1,96 × CV% / erro%)². Para erro de 5%: n = (0,392 × CV%)². Ex: CV% = 15% → n = (0,392 × 15)² = 34,6 → colete 35 obs."]]}].map(c=>{const d=a&&c.titulo.toLowerCase().includes(a),u=a?d?c.itens:c.itens.filter(([h,m])=>h.toLowerCase().includes(a)||m.toLowerCase().includes(a)):c.itens;return u.length?f.jsxs("div",{style:{background:e.card,border:`1px solid ${e.brd}`,borderLeft:`4px solid ${c.cor}`,borderRadius:"0 8px 8px 0",padding:"16px 20px",marginBottom:14},children:[f.jsxs("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:12},children:[f.jsx("span",{style:{background:c.cor,color:"#fff",fontWeight:900,fontSize:13,padding:"2px 10px",borderRadius:3},children:c
