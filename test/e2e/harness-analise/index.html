<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Harness Análise</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #raiz { height: 100%; margin: 0; }
  body { font-family:'Calibri','Carlito','Segoe UI',system-ui,sans-serif; }
  button { font-family: inherit; }
  .somente-impressao { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    html, body { background:#fff !important; color:#000 !important; height:auto;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .somente-tela { display: none !important; }
    .somente-impressao { display: block !important; }
    * { box-shadow: none !important; }
    table, figure, thead { break-inside: avoid; page-break-inside: avoid; }
    thead { display: table-header-group; }
    h1, h2 { break-after: avoid; page-break-after: avoid; }
  }
</style></head>
<body><div id="raiz"></div><script type="module" src="./main.jsx"></script></body></html>
