<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#14171A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RitmoPatrimar" />
    <meta name="description" content="RitmoPatrimar — cronoanálise e estudo de tempos, Patrimar Móveis" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>RitmoPatrimar — Estudo de Tempos</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #raiz { height: 100%; margin: 0; }
      body {
        background: #14171A;
        color: #F5F7FA;
        font-family: 'Calibri', 'Carlito', 'Segoe UI', system-ui, -apple-system, sans-serif;
        /* Sem seleção acidental de texto ao tocar rápido no botão de registro. */
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      /* Campos de formulário voltam a permitir seleção. */
      input, textarea { -webkit-user-select: text; user-select: text; }
      button { font-family: inherit; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
        outline: 3px solid #F7ECC0;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }

      /* --------------------------------------------------------------
         IMPRESSÃO — A4 retrato.

         O relatório impresso é um documento próprio, não a tela levada ao
         papel: só ele aparece na impressão, e a interface some inteira.
         -------------------------------------------------------------- */
      .somente-impressao { display: none; }

      @media print {
        @page { size: A4 portrait; margin: 12mm; }

        html, body {
          background: #fff !important;
          color: #000 !important;
          height: auto;
          /* Fundos e cores das barras do gráfico precisam sair impressos. */
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        .somente-tela { display: none !important; }
        .somente-impressao { display: block !important; }

        /* Nada de sombra ou canto arredondado no papel. */
        * { box-shadow: none !important; }

        /* Evita quebrar tabela, figura ou bloco de assinatura ao meio. */
        table, figure, thead { break-inside: avoid; page-break-inside: avoid; }
        thead { display: table-header-group; }
        h1, h2 { break-after: avoid; page-break-after: avoid; }
      }
    </style>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
